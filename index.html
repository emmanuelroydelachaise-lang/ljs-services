<!doctype html>
<html lang="fr">
<head>

  <link rel="manifest" href="./manifest.webmanifest">

          <linearGradient id="orange-h" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#e74a00"/><stop offset="0.55" stop-color="#ff7900"/><stop offset="1" stop-color="#ffc400"/></linearGradient>
          <linearGradient id="blue-h" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#61d5ff"/><stop offset="1" stop-color="#008ccc"/></linearGradient>

      <div>
        <div class="brand">LJS ENERGIES</div>
        <div class="subtitle">LJS Services</div>
      </div>
    </div>
  </header>
  <main class="container">
    <section class="card">
      <h1>LJS Services</h1>
      <p>Application prête à recevoir les fonctions du service.</p>
    </section>
  </main>
  <script>
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(()=>{});
  </script>

</html>
